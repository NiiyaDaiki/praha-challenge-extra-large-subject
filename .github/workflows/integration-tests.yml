name: Integration Tests

on:
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      prisma-test-db:
        image: postgres:12
        ports:
          - 5402:5432
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: prisma2020
          POSTGRES_DB: prisma
          TZ: Asia/Tokyo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: prisma-test-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: root
      POSTGRES_PASSWORD: prisma2020
      POSTGRES_DB: prisma
      DATABASE_URL: postgres://root:prisma2020@prisma-test-db:5432/prisma

    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Seed database
        working-directory: backend
        run: npx prisma db seed
      - name: Wait for database
        working-directory: backend
        run: |
          until nc -z prisma-test-db 5432; do
            echo "Waiting for database to be ready...";
            sleep 2;
          done
      - name: Run integration tests
        working-directory: backend
        run: npm run test:e2e
