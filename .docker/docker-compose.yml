version: "3.7"
services:
  prisma-db:
    container_name: prisma-db
    image: postgres:12
    ports:
      - "5403:5432"
    volumes:
      - prisma-store:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: prisma2020
      POSTGRES_DB: prisma
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: "Asia/Tokyo"
  prisma-test-db:
    container_name: prisma-test-db
    image: postgres:12
    ports:
      - "5402:5432"
    volumes:
      - prisma-test-store:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: prisma2020
      POSTGRES_DB: prisma
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: "Asia/Tokyo"
  nest-backend:
    container_name: nest-backend
    build:
      context: ..
      dockerfile: .docker/nest-backend/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - prisma-db
    environment:
      # DBへの接続情報をコンテナ間通信用に設定
      DATABASE_URL: "postgresql://root:prisma2020@prisma-db:5432/prisma"
volumes:
  prisma-store:
    driver: local
  prisma-test-store:
    driver: local
